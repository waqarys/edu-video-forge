[project]
name = "edu-video-forge"
version = "0.2.0"
description = "Generate professional educational videos from scripts with TTS, Manim, diagrams, and more"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18.0",
    "edge-tts>=6.1.0",
    "moviepy>=1.0.3",
    "pydub>=0.25.1",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "markdown>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
voiceover = ["manim-voiceover[gtts]"]
voiceover-gemini = ["manim-voiceover[gemini]"]

[project.scripts]
edu-video-forge = "edu_video_forge.__main__:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
